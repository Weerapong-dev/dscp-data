<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSCP - ระบบตรวจสอบการเดินเอกสาร</title>
  <meta name="description" content="ระบบตรวจสอบการเดินเอกสารในสถานศึกษา — Document Status Control Panel" />

  <!-- Preconnect for fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Design System CSS -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Favicon (inline SVG data URI) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%233b82f6' d='M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z'/></svg>" />
</head>
<body>

  <!-- App mounts here via App.boot() -->
  <div id="app-root">
    <!-- Initial loading screen -->
    <div style="
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:20px;
      font-family:'Sarabun',sans-serif;
      background:linear-gradient(135deg,#faf5ff 0%,#fce7f3 100%);
    ">
      <div style="
        width:60px;height:60px;
        background:linear-gradient(135deg,#a855f7,#ec4899);
        border-radius:18px;
        display:flex;align-items:center;justify-content:center;
        box-shadow:0 8px 28px rgba(168,85,247,0.38);
      ">
        <svg viewBox="0 0 24 24" width="32" height="32"><path fill="white" d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
      </div>
      <div style="text-align:center">
        <div style="font-size:1.1rem;font-weight:800;color:#3b0764;">DSCP</div>
        <div style="font-size:0.82rem;margin-top:4px;color:#a78bca;">กำลังเริ่มระบบ...</div>
      </div>
      <div style="
        width:36px;height:36px;
        border:3px solid rgba(168,85,247,0.15);
        border-top-color:#a855f7;
        border-radius:50%;
        animation:sp 0.8s linear infinite;
      "></div>
      <style>@keyframes sp{to{transform:rotate(360deg)}}</style>
    </div>
  </div>

  <!--
    ╔══════════════════════════════════════════════════════╗
    ║  JavaScript — loaded in dependency order             ║
    ╚══════════════════════════════════════════════════════╝
  -->

  <!-- 1. Config (constants, defaults) -->
  <script src="js/config.js"></script>

  <!-- 2. GitHub API service -->
  <script src="js/github.js"></script>

  <!-- 3. Authentication service -->
  <script src="js/auth.js"></script>

  <!-- 4. Data / Document service -->
  <script src="js/documents.js"></script>

  <!-- 5. UI rendering engine -->
  <script src="js/ui.js"></script>

  <!-- 6. Main application + router -->
  <script src="js/app.js"></script>

  <script>
    // Replace the static #app-root with the real app mount
    // app.js listens for DOMContentLoaded and calls App.boot()
    // which will replace document.body.innerHTML with the real UI.
    // The loading screen above is just cosmetic.
  </script>
</body>
</html>
